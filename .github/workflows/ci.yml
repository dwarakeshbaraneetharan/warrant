name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # These cover the metrics and the citation grounding, and need no model
      # weights, so they run in seconds on every push.
      - name: Test
        run: python -m pytest tests/ -q

  retrieval-gate:
    name: retrieval quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e '.[dev]'

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-${{ runner.os }}

      - name: Fetch corpus and human judgments
        run: python -m warrant.cli fetch

      # The point of this job. Retrieval is scored against SciFact's human
      # relevance judgments and the build fails if quality regresses, so a change
      # to chunking, fusion or the embedding model cannot quietly make the system
      # worse.
      #
      # The gate runs the hybrid configuration without the cross-encoder: it needs
      # only the 90 MB embedding model rather than a 440 MB reranker, which keeps
      # the job under a couple of minutes. The reranked numbers are reproduced by
      # bench/ablation.py, run on demand.
      #
      # Thresholds sit a little under the measured values (0.691 nDCG@10, 0.940
      # Recall@50 on all 300 claims) so ordinary variation does not fail the build
      # while a genuine break does.
      - name: Score retrieval and enforce the gate
        run: |
          python -m warrant.cli evaluate \
            --no-reranker \
            --min-ndcg 0.65 \
            --min-recall 0.90 \
            --json retrieval-scores.json

      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-scores
          path: retrieval-scores.json
